# Machine translation training config
# PSA-only silver data until human gold exists.
# Languages: English · Kiswahili · Kikuyu · Ekegusii (mT5 + NLLB vocab-extend)

model:
  name: facebook/nllb-200-distilled-600M
  alt_models:
    - google/mt5-small
  max_source_length: 128
  max_target_length: 128

languages:
  source_nllb: eng_Latn
  pairs:
    - source: en
      target: sw
      target_nllb: swh_Latn
    - source: en
      target: kik
      target_nllb: kik_Latn
    - source: en
      target: guz
      target_nllb: guz_Latn
      nllb_vocab_extend: true
      nllb_init_from: kik_Latn

data:
  train: datasets/mt/train.csv
  dev: datasets/mt/dev.csv
  test: datasets/mt/test.csv

train:
  output_dir: artifacts/mt_baseline
  num_epochs: 1
  learning_rate: 2.0e-5
  train_batch_size: 4
  eval_batch_size: 4
  weight_decay: 0.01
  warmup_ratio: 0.03
  gradient_accumulation_steps: 4
  fp16: true
  seed: 42
  logging_steps: 25
  save_steps: 200
  eval_steps: 200
  max_train_samples: null
  max_eval_samples: 200

policy:
  psa_only: true
  human_reviewed_required_for_gold: true
  allow_silver_for_baseline: true
  never_promote_dry_run: true
  exclude_external_opus: true

# Target languages — LughaLink AI
# Course brief: English/Kiswahili ↔ selected indigenous language(s).
# Selected indigenous target: Kikuyu (Bantu) — NLLB-supported (kik_Latn).

languages:
  - id: en
    name: English
    iso_639_1: en
    iso_639_3: eng
    nllb: eng_Latn
    role: source
  - id: sw
    name: Kiswahili
    iso_639_1: sw
    iso_639_3: swa
    nllb: swh_Latn
    role: pivot
  - id: kik
    name: Kikuyu
    iso_639_1: ki
    iso_639_3: kik
    nllb: kik_Latn
    role: target

seed_defaults:
  source_nllb: eng_Latn
  # Seed pivot + indigenous target from PSA English sentences
  target_ids: [sw, kik]
  max_source_tokens: 200
  min_source_tokens: 12

nllb_model: facebook/nllb-200-distilled-600M

[project]
name = "lughalink-ai"
version = "0.1.0"
description = "Public Information Translation Platform for Kenya"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.2",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "requests>=2.31",
    "httpx>=0.27",
    "langdetect>=1.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "feedparser>=6.0",
    "trafilatura>=1.9",
    "rapidfuzz>=3.9",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "matplotlib>=3.8",
    "jupyter>=1.0",
    "datasets>=2.19",
]
scraper = [
    "selenium>=4.21",
    "playwright>=1.44",
]
mt = [
    "transformers>=4.40",
    "torch>=2.2",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
    "accelerate>=0.30",
    "evaluate>=0.4",
    "sacrebleu>=2.4",
    "datasets>=2.19",
    "huggingface_hub>=0.23",
]
demo = [
    "streamlit>=1.32",
    "transformers>=4.40",
    "torch>=2.2",
    "sentencepiece>=0.2",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "transformers>=4.40",
    "torch>=2.2",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
    "accelerate>=0.30",
    "huggingface_hub>=0.23",
    "safetensors>=0.4",
]

[project.scripts]
lughalink = "services.cli:app"

[tool.setuptools.packages.find]
include = ["services*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
